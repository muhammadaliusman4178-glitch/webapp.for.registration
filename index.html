<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manzil Tech Online Learning Enrollment Web App</title>
  <style>
    body {
      font-family: "Poppins", sans-serif;
      background: linear-gradient(135deg, #0099ff, #00cc99);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .container {
      background-color: white;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
      width: 350px;
      text-align: center;
      transition: all 0.3s ease;
    }

    h2 {
      color: #006699;
      margin-bottom: 20px;
    }

    input {
      width: 90%;
      padding: 10px;
      margin: 8px 0;
      border-radius: 8px;
      border: 1px solid #ccc;
      outline: none;
      transition: border-color 0.3s;
    }

    input:focus {
      border-color: #00cc99;
    }

    button {
      background-color: #00cc99;
      color: white;
      border: none;
      padding: 12px 25px;
      margin-top: 10px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 16px;
      transition: background 0.3s;
    }

    button:hover {
      background-color: #009977;
    }

    .message {
      font-size: 18px;
      color: #004466;
      display: none;
    }

    .success {
      color: green;
      font-weight: bold;
    }

    .easypaisa {
      margin-top: 15px;
      color: #333;
      font-size: 16px;
    }
  </style>
</head>
<body>

  <div class="container" id="formContainer">
    <h2>Manzil Tech Online Learning</h2>
    <p><strong>Student Enrollment Form</strong></p>
    <form id="enrollmentForm">
      <input type="text" id="firstName" placeholder="First Name" required><br>
      <input type="text" id="lastName" placeholder="Last Name" required><br>
      <input type="text" id="fatherName" placeholder="Father Name" required><br>
      <input type="text" id="fatherCnic" placeholder="Father CNIC" required><br>
      <input type="text" id="yourCnic" placeholder="Your CNIC" required><br>
      <input type="email"id="email"placeholder="Email" required><br>
      <input type="text" id="Phone Number"placeholder="Phone Number" required><br>
      <input type="text" id="qualification" placeholder="Qualification" required><br>
      <button type="submit">Enroll Now</button>
    </form>
  </div>

  <div class="container message" id="confirmationMessage">
    <h2 class="success">🎉 Congratulations!</h2>
    <p>You are successfully enrolled in <strong>Manzil Tech Online Learning</strong>.</p>
    <p class="easypaisa">
      Please send <strong>Rs. 3000</strong> advance via <strong>Easypaisa</strong> to:<br>
      <strong>0333-5369075</strong><br><br>
      Once payment is made, your classes will start.
    </p>
  </div>

  <script>
    const form = document.getElementById('enrollmentForm');
    const formContainer = document.getElementById('formContainer');
    const confirmationMessage = document.getElementById('confirmationMessage');

    form.addEventListener('submit', function(e) {
      e.preventDefault();

      // Hide form and show success message
      formContainer.style.display = 'none';
      confirmationMessage.style.display = 'block';
    });
  </script>

</body>
</html>
